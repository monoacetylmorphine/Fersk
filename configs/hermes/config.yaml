model:
  default: gpt-5.6-terra
  provider: custom:ai.soulecho.cc
  base_url: 'https://hk.ai.soulecho.cc/v1'
max_concurrent_sessions: 8
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: low
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 600
  home_mode: auto
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.13-nodejs26
  singularity_image: docker://nikolaik/python-nodejs:python3.13-nodejs26
  modal_image: nikolaik/python-nodejs:python3.13-nodejs26
  daytona_image: nikolaik/python-nodejs:python3.13-nodejs26
  container_cpu: 2
  container_memory: 5120
  container_disk: 51200
  container_persistent: false
  docker_mount_cwd_to_workspace: true
  docker_run_as_host_user: true
  lifetime_seconds: 3600
  quiet: true
  echo: false
web:
  backend: tavily
  use_gateway: false
checkpoints:
  enabled: true
  max_snapshots: 10
context_file_max_chars: 1800000
file_read_max_chars: 1000000
tool_output:
  max_bytes: 300000
  max_lines: 8000
  max_line_length: 5000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
  loop_caps:
    max_subagents: 0
compression:
  enabled: true
  progress_notices: true
  threshold: 0.5
  target_ratio: 0.2
  tail_mode: lean
  protect_last_n: 20
  proactive_prune_tokens: 0
  hygiene_hard_message_limit: 5000
  hygiene_timeout_seconds: 30
  protect_first_n: 5
  in_place: true
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: kimi-coding-cn
    model: kimi-k3
    timeout: 180
  compression:
    provider: deepseek
    model: deepseek-v4-flash
    timeout: 180
  title_generation:
    provider: custom:ai.soulecho.cc
    model: gpt-5.6-terra
  profile_describer:
    provider: deepseek
    model: deepseek-v4-flash
display:
  compact: false
  busy_input_mode: steer
  bell_on_complete: true
  show_reasoning: true
  reasoning_full: false
  background_process_notifications: concise
  streaming: true
  file_mutation_verifier: true
  skin: default
  interim_assistant_messages: true
  show_commentary: false
  tool_progress: false
  terminal_merge_output: true
  tool_output_inline: false
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: true
  tui_theme: light
dashboard:
  theme: default
  font: theme
stt:
  enabled: true
  echo_transcripts: false
  language: zh
  local:
    model: base
    language: zh
  provider: local
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 5000
  user_char_limit: 5000
moa:
  enabled: false
skills:
  inline_shell: true
  inline_shell_timeout: 300
  guard_agent_created: true
  creation_nudge_interval: 15
  disabled:
    - agent-browser
    - apple-notes
    - apple-reminders
    - audiocraft-audio-generation
    - box
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - comfyui
    - email-inbox-triage
    - evaluating-llms-harness
    - findmy
    - get-xiaohongshu-notes
    - gif-search
    - github-auth
    - github-code-review
    - github-issue-to-pr
    - github-issues
    - github-pr-workflow
    - github-repo-management
    - google-workspace
    - heartmula
    - himalaya
    - huggingface-hub
    - imessage
    - jupyter-live-kernel
    - llama-cpp
    - opencode
    - openhue
    - segment-anything-model
    - self-improving-agent
    - serving-llms-vllm
    - songsee
    - weights-and-biases
    - xiaohongshu-note-create-guide
    - xurl
    - youtube-content
    - yuanbao
timezone: Asia/Shanghai
approvals:
  destructive_slash_confirm: true
command_allowlist:
  - script execution via -e/-c flag
hooks_auto_accept: true
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true
code_execution:
  timeout: 600
  max_tool_calls: 10
streaming:
  enabled: true
onboarding:
  seen:
    openclaw_residue_cleanup: true
    busy_input_prompt: true
    profile_build_offered: true
updates:
  pre_update_backup: true
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 38
fallback_model:
  provider: deepseek
  model: deepseek/deepseek-v4-pro
session_reset:
  mode: both
  idle_minutes: 120
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - context_engine
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - video
    - vision
    - web
platforms:
  feishu:
    enabled: true
custom_providers:
  - name: Ai.soulecho.cc
    base_url: https://hk.ai.soulecho.cc/v1
    key_env: HERMES_CUSTOM_AI_SOULECHO_CC_API_KEY
    model: gpt-5.6-sol
    models:
      gpt-5.5: {}
      gpt-5.4: {}
      codex-auto-review: {}
      gpt-5.3-codex-spark: {}
      gpt-5.6-sol: {}
      gpt-5.6-terra: {}
    api_mode: chat_completions
    models_discovered: true
plugins:
  enabled:
    - model-providers/deepseek
    - observability/langfuse
    - platforms/feishu
    - web/tavily
  disabled: []
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
known_builtin_toolsets:
  cli:
    - bfl
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

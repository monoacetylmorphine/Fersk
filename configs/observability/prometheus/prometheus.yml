scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Host metrics
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # Docker container metrics
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: openclaw
    scrape_interval: 30s
    metrics_path: /api/diagnostics/prometheus
    authorization:
      credentials_file: /etc/prometheus/openclaw-gateway-token
    static_configs:
      - targets: ["openclaw-gateway:18789"]
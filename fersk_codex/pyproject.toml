[project]
name = "fersk_codex"
dynamic = ["version"]
description = "Fersk Codex & Lark Bridge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "lark-oapi",
    "openai",
    "openai-codex",
    "openai-codex-cli-bin",
    "python-dotenv",
    "jsonschema>=4.0.0",
    "regex>=2026.9.10",
    "markitdown[xlsx]>=0.1.7",
    "openpyxl>=3.1.5",
]

[project.scripts]
fersk-codex = "fersk_codex.main:cli"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = [
    "fersk_codex",
    "fersk_codex.configs",
    "fersk_codex.codex",
    "fersk_codex.middleware",
    "fersk_codex.session",
    "fersk_codex.services",
    "fersk_codex.services.lark",
    "fersk_codex.utils",
]
package-dir = { fersk_codex = "." }

[tool.setuptools.package-data]
fersk_codex = ["configs/*.json"]

[tool.setuptools_scm]
# 本项目位于 Git 仓库的子目录中。
search_parent_directories = true
# 来源：项目构建策略；源码缺少 Git 和分发元数据时标记为未知版本。
fallback_version = "0.0.0"

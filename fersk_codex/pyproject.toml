[project]
name = "fersk_codex"
dynamic = ["version"]
description = "Fersk Codex & Lark Bridge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "lark-oapi",
    "openai",
    "openai-codex",
    "openai-codex-cli-bin",
    "python-dotenv",
    "jsonschema>=4.0.0",
    "regex>=2026.9.10",
]

[project.scripts]
fersk-codex = "fersk_codex.main:cli"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = [
    "fersk_codex",
    "fersk_codex.configs",
    "fersk_codex.codex",
    "fersk_codex.middleware",
    "fersk_codex.session",
    "fersk_codex.services",
    "fersk_codex.services.lark",
    "fersk_codex.utils",
]
package-dir = { fersk_codex = "." }

[tool.setuptools.package-data]
fersk_codex = ["configs/*.json"]

[tool.setuptools_scm]
# This project is located in a subdirectory of the Git repository.
search_parent_directories = true
# Source: project build policy; mark the version as unknown when Git and distribution metadata are unavailable.
fallback_version = "0.0.0"

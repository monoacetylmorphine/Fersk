[project]
name = "fersk_codex"
version = "0.1.0"
description = "Fersk Codex & Lark Bridge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "annotated-doc",
    "annotated-types",
    "anyio",
    "attrs",
    "certifi",
    "cffi",
    "charset-normalizer",
    "click",
    "cryptography",
    "h11",
    "httpcore",
    "httpcore2",
    "httpx",
    "httpx2",
    "idna",
    "jiter",
    "jsonschema",
    "jsonschema-specifications",
    "lark-oapi",
    "markdown-it-py",
    "mdurl",
    "openai",
    "openai-codex",
    "openai-codex-cli-bin",
    "opentelemetry-api",
    "pycparser",
    "pycryptodome",
    "pydantic",
    "pydantic-core",
    "pygments",
    "pyjwt",
    "python-dotenv",
    "python-multipart",
    "referencing",
    "requests",
    "requests-toolbelt",
    "rich",
    "rpds-py",
    "shellingham",
    "sniffio",
    "sse-starlette",
    "starlette",
    "truststore",
    "typer",
    "typing-extensions",
    "typing-inspection",
    "urllib3",
    "uvicorn",
    "websockets",
]

[project.scripts]
fersk-codex = "fersk_codex.gateway:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = [
    "fersk_codex",
    "fersk_codex.configs",
    "fersk_codex.core",
    "fersk_codex.middleware",
    "fersk_codex.services",
    "fersk_codex.services.lark",
    "fersk_codex.utils",
]
package-dir = { fersk_codex = "." }

[tool.setuptools.package-data]
fersk_codex = ["configs/*.json"]

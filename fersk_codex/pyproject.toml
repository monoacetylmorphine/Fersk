[project]
name = "fersk_codex"
version = "0.1.0"
description = "Fersk Codex & Lark Bridge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "lark-oapi",
    "openai",
    "openai-codex",
    "openai-codex-cli-bin",
    "python-dotenv",
    "jsonschema>=4.0.0",
]

[project.scripts]
fersk-codex = "fersk_codex.gateway:cli"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = [
    "fersk_codex",
    "fersk_codex.configs",
    "fersk_codex.core",
    "fersk_codex.middleware",
    "fersk_codex.services",
    "fersk_codex.services.lark",
    "fersk_codex.utils",
]
package-dir = { fersk_codex = "." }

[tool.setuptools.package-data]
fersk_codex = ["configs/*.json"]

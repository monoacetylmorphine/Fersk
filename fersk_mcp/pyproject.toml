[project]
name = "fersk_mcp"
dynamic = ["version"]
description = "Fersk MCP server"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "lark-oapi>=1.7.3",
    "mcp>=2.2.0",
    "openai>=3.10.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
fersk-mcp = "fersk_mcp.server:main"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = [
    "fersk_mcp",
    "fersk_mcp.configs",
    "fersk_mcp.services",
    "fersk_mcp.services.lark",
    "fersk_mcp.utils",
    "fersk_mcp.tools",
    "fersk_mcp.tools.internal_tools",
    "fersk_mcp.tools.lark_tools",
]
package-dir = { fersk_mcp = "." }

[tool.setuptools.package-data]
fersk_mcp = ["configs/*.json"]

[tool.setuptools_scm]
# 本项目位于 Git 仓库的子目录中。
search_parent_directories = true
# 来源：项目构建策略；源码缺少 Git 和分发元数据时标记为未知版本。
fallback_version = "0.0.0"
